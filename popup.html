<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مترجم اجتماعات جوجل</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 350px;
      font-family: 'Cairo', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      direction: rtl;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .header h2 {
      font-size: 16px;
      font-weight: 800;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background: linear-gradient(135deg, #6366f1, #a855f7);
    }
    input:checked + .slider:before {
      transform: translateX(-20px);
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      outline: none;
    }
    select option {
      background: #1e293b;
      color: #fff;
    }
    select:focus, input[type="text"]:focus {
      border-color: #6366f1;
    }
    .hint {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .hint a {
      color: #38bdf8;
      text-decoration: none;
    }
    .btn-save {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
    }
    .btn-save:hover {
      filter: brightness(1.1);
    }
    .toast {
      display: none;
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      background: #10b981;
      color: white;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2><span>🌐</span> مترجم Google Meet</h2>
    <label class="switch">
      <input type="checkbox" id="toggle-extension" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="form-group">
    <label for="target-lang-select">لغة الترجمة المستهدفة (Target Language):</label>
    <select id="target-lang-select">
      <option value="ar">🇸🇦 العربية (Arabic)</option>
      <option value="en">🇬🇧 الإنجليزية (English)</option>
      <option value="fr">🇫🇷 الفرنسية (French)</option>
      <option value="de">🇩🇪 الألمانية (German)</option>
      <option value="es">🇪🇸 الإسبانية (Spanish)</option>
      <option value="tr">🇹🇷 التركية (Turkish)</option>
      <option value="it">🇮🇹 الإيطالية (Italian)</option>
      <option value="ru">🇷🇺 الروسية (Russian)</option>
      <option value="zh">🇨🇳 الصينية (Chinese)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="engine-select">محرك الترجمة:</label>
    <select id="engine-select">
      <option value="fast">⚡ المحرك السريع التلقائي (Google Translate)</option>
      <option value="gemini">✨ Gemini AI (ترجمة سياقية ذكية غير حرفية)</option>
    </select>
  </div>

  <div class="form-group" id="api-key-group" style="display: none;">
    <label for="api-key-input">مفتاح Gemini API Key:</label>
    <input type="text" id="api-key-input" placeholder="أدخل مفتاح Gemini API هنا...">
    <div class="hint">
      احصل على مفتاح مجاني فوراً من <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.
    </div>
  </div>

  <div class="form-group">
    <label for="font-size-input">حجم خط الترجمة (px):</label>
    <input type="number" id="font-size-input" min="14" max="36" value="22">
  </div>

  <button class="btn-save" id="btn-save-settings">حفظ الإعدادات 💾</button>
  <div class="toast" id="save-toast">تم حفظ الإعدادات بنجاح! ✨</div>

  <script src="popup.js"></script>
</body>
</html>
